<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AB RENOV 35 — Documents Chantier</title>
<style>
:root {
  --navy: #162D49;
  --beige: #F3EAE2;
  --lav: #A495C3;
  --lav2: #7B6BA8;
  --white: #FFFFFF;
  --border: #DDD5CA;
  --muted: #8A9BAD;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--beige); font-family: 'Segoe UI', sans-serif; color: var(--navy); }

.header {
  background: var(--navy);
  padding: 14px 18px 0;
  position: sticky; top: 0; z-index: 100;
}
.header-top { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; }
.logo-text { font-family: 'Futura PT','Century Gothic','Futura',sans-serif; font-weight: 800; font-size: 17px; color: var(--white); letter-spacing: 1px; }
.logo-sub { font-size: 9px; color: var(--lav); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
.header-band { height: 3px; background: linear-gradient(90deg, var(--lav), var(--lav2), var(--navy)); }

.main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

.section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }

.type-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.type-btn {
  background: var(--white); border: 2px solid var(--border);
  border-radius: 10px; padding: 12px 6px; text-align: center;
  cursor: pointer; transition: all 0.15s;
}
.type-btn.active { border-color: var(--navy); background: var(--navy); color: var(--white); }
.type-btn .code { font-weight: 800; font-size: 16px; display: block; margin-bottom: 3px; }
.type-btn .name { font-size: 10px; color: var(--muted); line-height: 1.2; }
.type-btn.active .name { color: rgba(255,255,255,0.6); }

.card { background: var(--white); border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); }

label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; margin-top: 14px; }
label:first-child { margin-top: 0; }

input, textarea, select {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 14px; font-family: inherit;
  background: #FAFAF9; color: var(--navy); outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--lav2); }
textarea { resize: vertical; min-height: 80px; }

.btn-generate {
  width: 100%; padding: 14px; background: var(--navy); color: var(--white);
  border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
  cursor: pointer; margin-top: 16px; transition: opacity 0.15s;
}
.btn-generate:hover { opacity: 0.85; }
.btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

/* LOADING */
#loading { display: none; text-align: center; padding: 30px 0; }
#loading.visible { display: block; }
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--navy); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* RESULT */
#doc-result { display: none; }
#doc-result.visible { display: block; }

.doc-card {
  background: var(--white); border-radius: 12px; padding: 20px;
  border: 1px solid var(--border); margin-bottom: 14px;
  white-space: pre-wrap; font-size: 14px; line-height: 1.7;
}
.doc-header-band {
  height: 3px; background: linear-gradient(90deg, var(--lav), var(--navy));
  border-radius: 2px; margin-bottom: 14px;
}

.doc-section { margin-bottom: 16px; }
.doc-section-title { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--lav2); margin-bottom: 6px; }
.doc-text { font-size: 14px; line-height: 1.7; color: var(--navy); }

.actions { display: flex; gap: 10px; margin-bottom: 20px; }
.btn-action {
  flex: 1; padding: 12px; border-radius: 10px; font-size: 13px;
  font-weight: 700; cursor: pointer; border: none; transition: opacity 0.15s;
}
.btn-print { background: var(--navy); color: var(--white); }
.btn-reset { background: var(--white); color: var(--navy); border: 2px solid var(--border); }

.modif-zone { background: var(--white); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
.btn-modif {
  width: 100%; padding: 11px; background: var(--lav); color: var(--white);
  border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 10px;
}

@media print {
  .header, .actions, .modif-zone, #form-section { display: none !important; }
  #doc-result { display: block !important; }
  .doc-card { border: none; padding: 0; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo-text">AB RENOV 35</div>
      <div class="logo-sub">Documents Chantier</div>
    </div>
  </div>
  <div class="header-band"></div>
</div>

<div class="main">

  <!-- FORMULAIRE -->
  <div id="form-section">
    <div class="section-label">Type de document</div>
    <div class="type-grid">
      <div class="type-btn active" data-type="CRCh" onclick="selectType(this)">
        <span class="code">CRCh</span>
        <span class="name">Compte Rendu Chantier</span>
      </div>
      <div class="type-btn" data-type="FCh" onclick="selectType(this)">
        <span class="code">FCh</span>
        <span class="name">Fiche Chantier</span>
      </div>
      <div class="type-btn" data-type="PVR" onclick="selectType(this)">
        <span class="code">PVR</span>
        <span class="name">PV Réception</span>
      </div>
    </div>

    <div class="card">
      <label>Chantier / Client</label>
      <input type="text" id="chantier" placeholder="Ex: Dupont — 12 rue des Lilas, Rennes">

      <label>Opérateur</label>
      <input type="text" id="operateur" placeholder="Ton prénom ou initiales">

      <label>Travaux réalisés / Observations</label>
      <textarea id="observations" placeholder="Décris les travaux du jour, les observations, les points importants…"></textarea>

      <label>Réserves / Problèmes (optionnel)</label>
      <textarea id="reserves" placeholder="Réserves constatées, problèmes, points à surveiller…" style="min-height:60px"></textarea>

      <label>Photos / Documents (optionnel)</label>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button type="button" onclick="document.getElementById('photo-input').click()" style="flex:1;padding:12px 6px;background:var(--navy);color:white;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">📷 Prendre une photo</button>
        <button type="button" onclick="document.getElementById('file-input').click()" style="flex:1;padding:12px 6px;background:var(--white);color:var(--navy);border:2px solid var(--border);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">📎 Ajouter un document</button>
      </div>
      <div id="upload-label" style="font-size:12px;color:var(--muted);text-align:center;min-height:18px"></div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handleFile(this)">
      <input type="file" id="file-input" accept="image/*,application/pdf,.doc,.docx" style="display:none" onchange="handleFile(this)">
    </div>

    <button class="btn-generate" onclick="generer()">⚡ Générer le document</button>
  </div>

  <!-- LOADING -->
  <div id="loading">
    <div class="spinner"></div>
    <div style="color:var(--muted);font-size:14px">Génération en cours…</div>
  </div>

  <!-- RÉSULTAT -->
  <div id="doc-result">
    <div class="actions">
      <button class="btn-action btn-print" onclick="imprimerDoc()">🖨️ Imprimer</button>
      <button class="btn-action btn-reset" onclick="resetForm()">↩ Nouveau</button>
    </div>

    <div class="doc-card">
      <div class="doc-header-band"></div>
      <div id="doc-content"></div>
    </div>

    <div class="modif-zone">
      <div class="section-label">Modifier / Compléter</div>
      <textarea id="modif-input" placeholder="Ex: Ajoute une réserve sur la peinture du couloir…" style="min-height:60px;background:#EDE9F4;border-color:var(--lav)"></textarea>
      <button class="btn-modif" onclick="modifier()">✏️ Modifier le document</button>
    </div>
  </div>

</div>

<script>
const ANTHROPIC_KEY_GAS = 'https://script.google.com/macros/s/PLACEHOLDER_GAS_URL/exec';

let selectedType = 'CRCh';
let lastDoc = '';
let conversationHistory = [];
let currentFileData = null;
let currentFileType = null;
let currentFileName = null;

const typeLabels = {
  CRCh: 'Compte Rendu de Chantier',
  FCh: 'Fiche Chantier',
  PVR: 'Procès-Verbal de Réception'
};

function selectType(el) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedType = el.dataset.type;
}

const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkxZ71UhLWUsq7DK5utewVbTcJGirALgQElAu9BgPOf7SwhTqwYsiM4w6vJemNc5ulmQ/exec';

async function callClaude(payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error);
  conversationHistory = data.history;
  return data.text;
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  currentFileName = file.name;
  currentFileType = file.type;
  const reader = new FileReader();
  reader.onload = (e) => {
    currentFileData = e.target.result.split(',')[1];
    document.getElementById('upload-label').textContent = '✅ ' + file.name;
  };
  reader.readAsDataURL(file);
}

async function generer() {
  const chantier = document.getElementById('chantier').value.trim();
  const operateur = document.getElementById('operateur').value;
  const observations = document.getElementById('observations').value.trim();
  const reserves = document.getElementById('reserves').value.trim();

  if (!chantier || !observations) {
    alert('Chantier et observations obligatoires.');
    return;
  }

  document.getElementById('form-section').style.display = 'none';
  document.getElementById('loading').classList.add('visible');

  const prompt = `Génère un ${typeLabels[selectedType]} (${selectedType}) pour :
- Chantier/Client : ${chantier}
- Opérateur : ${operateur}
- Travaux/Observations : ${observations}
${reserves ? `- Réserves : ${reserves}` : ''}

Format : sections titrées, contenu professionnel et clair.`;

  conversationHistory = [{ role: 'user', content: prompt }];

  try {
    const result = await callClaude(conversationHistory);
    conversationHistory.push({ role: 'assistant', content: result });
    lastDoc = result;
    afficherDoc(result);
  } catch(e) {
    alert('Erreur API : ' + e.message);
    resetForm();
  }
}

async function modifier() {
  const modif = document.getElementById('modif-input').value.trim();
  if (!modif) return;

  document.getElementById('modif-input').disabled = true;
  document.querySelector('.btn-modif').disabled = true;

  try {
    const result = await callClaude({ modif, history: conversationHistory });
    lastDoc = result;
    afficherDoc(result);
    document.getElementById('modif-input').value = '';
  } catch(e) {
    alert('Erreur : ' + e.message);
  } finally {
    document.getElementById('modif-input').disabled = false;
    document.querySelector('.btn-modif').disabled = false;
  }
}

function afficherDoc(text) {
  document.getElementById('loading').classList.remove('visible');
  document.getElementById('doc-result').classList.add('visible');

  const lines = text.split('\n');
  let html = '';
  for (const line of lines) {
    if (line.match(/^#{1,3} /)) {
      html += `<div class="doc-section-title">${line.replace(/^#{1,3} /, '')}</div>`;
    } else if (line.match(/^\*\*(.+)\*\*$/)) {
      html += `<div class="doc-section-title">${line.replace(/\*\*/g,'')}</div>`;
    } else if (line.trim()) {
      html += `<div class="doc-text">${line}</div>`;
    } else {
      html += '<br>';
    }
  }
  document.getElementById('doc-content').innerHTML = html;
}

function resetForm() {
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('doc-result').classList.remove('visible');
  document.getElementById('loading').classList.remove('visible');
  document.getElementById('modif-input').value = '';
  conversationHistory = [];
}

function imprimerDoc() {
  window.print();
}
</script>
</body>
</html>
