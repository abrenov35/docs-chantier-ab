function selectType(type){selectedType=type;document.getElementById('type-select').value=type}function canvasCompress(img,maxPx,quality){let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(w>=h?w>maxPx:h>maxPx){if(w>=h){h=Math.round(h*maxPx/w);w=maxPx}else{w=Math.round(w*maxPx/h);h=maxPx}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',quality).split(',')[1]}function compressImage(file,callback){const img=new Image(),url=URL.createObjectURL(file);img.onload=function(){URL.revokeObjectURL(url);let data=canvasCompress(img,800,.5);if(data.length>1_000_000)data=canvasCompress(img,400,.4);callback({name:file.name,type:'image/jpeg',data})};img.onerror=function(){URL.revokeObjectURL(url);const r=new FileReader();r.onload=e=>callback({name:file.name,type:file.type,data:e.target.result.split(',')[1]});r.onerror=()=>callback({name:file.name,type:file.type,data:''});r.readAsDataURL(file)};img.src=url}
async function handleFiles(input){const files=Array.from(input.files).slice(0,3),existingPhotos=currentFiles.filter(f=>f.type&&f.type.startsWith('image/')).length,newPhotos=files.filter(f=>f.type.startsWith('image/')).length;if(existingPhotos+newPhotos>6){alert('Maximum 6 photos.');input.value='';return}for(let i=0;i<files.length;i++){if(i>0)await new Promise(r=>setTimeout(r,300));const file=files[i];if(file.type.startsWith('image/')){const c=await new Promise(resolve=>compressImage(file,resolve));currentFiles.push(c)}else{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>resolve(e.target.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});currentFiles.push({name:file.name,type:file.type,data})}renderFilesList()}input.value=''}async function ajouterFichiersModif(files){const fileArr=Array.from(files).slice(0,3);if(!fileArr.length)return;const existingPhotos=currentFiles.filter(f=>f.type&&f.type.startsWith('image/')).length,newPhotos=fileArr.filter(f=>f.type&&f.type.startsWith('image/')).length;if(existingPhotos+newPhotos>6){alert('Maximum 6 photos.');return}const total=fileArr.length;setSavingUI(true,`📥 0/${total} chargé…`);for(let i=0;i<fileArr.length;i++){if(i>0)await new Promise(r=>setTimeout(r,300));const file=fileArr[i];const data=await new Promise(resolve=>{const r=new FileReader();r.onload=e=>resolve(e.target.result.split(',')[1]);r.onerror=()=>resolve(null);r.readAsDataURL(file)});if(data)currentFiles.push({name:file.name,type:file.type,data});setSavingUI(true,`📥 ${i+1}/${total} chargé…`);renderFilesList();afficherPhotosDoc()}sauvegarderDebounce()}function removeFile(i){currentFiles.splice(i,1);renderFilesList();afficherPhotosDoc()}function renderFilesList(){const tags=currentFiles.map((f,i)=>`<div class="file-tag">📄 ${f.name} <button onclick="removeFile(${i})">✕</button></div>`).join('');const el1=document.getElementById('files-list'),el2=document.getElementById('modif-files-list');if(el1)el1.innerHTML=tags;if(el2)el2.innerHTML=tags}function afficherPhotosDoc(){const photos=currentFiles.filter(f=>f.type&&f.type.startsWith('image/')),docFrame=document.getElementById('doc-frame');if(!docFrame)return;docFrame.querySelectorAll('.photo-section-title, .doc-photos').forEach(el=>el.remove());if(photos.length===0)return;const target=document.getElementById('doc-content')||docFrame,titleEl=document.createElement('div');titleEl.className='photo-section-title';titleEl.textContent='📷 Photos du chantier';const gridEl=document.createElement('div');gridEl.className='doc-photos';gridEl.id='doc-photos-section';photos.forEach((f,i)=>{const img=document.createElement('img');img.className='doc-photo';img.onclick=()=>openLightbox(i);if(f.url&&f.url.startsWith('dropbox:'))resolveDropboxUrl(f.url.replace('dropbox:','')).then(link=>{img.src=link});else img.src=f.url||`data:${f.type};base64,${f.data}`;gridEl.appendChild(img)});target.appendChild(titleEl);target.appendChild(gridEl)}function openLightbox(idx){const photos=currentFiles.filter(f=>f.type&&f.type.startsWith('image/'));if(!photos[idx])return;const p=photos[idx],imgEl=document.getElementById('lightbox-img');if(p.url&&p.url.startsWith('dropbox:'))resolveDropboxUrl(p.url.replace('dropbox:','')).then(link=>{imgEl.src=link});else imgEl.src=p.url||`data:${p.type};base64,${p.data}`;document.getElementById('lightbox').classList.add('open')}function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}function startProgress(){const steps=[[5,'Envoi des données…'],[20,'Analyse en cours…'],[45,'Rédaction du document…'],[70,'Mise en forme…'],[90,'Finalisation…']];let i=0;const bar=document.getElementById('progress-bar'),pct=document.getElementById('progress-pct'),step=document.getElementById('progress-step');bar.style.width='5%';pct.textContent='5%';step.textContent=steps[0][1];progressTimer=setInterval(()=>{i++;if(i<steps.length){bar.style.width=steps[i][0]+'%';pct.textContent=steps[i][0]+'%';step.textContent=steps[i][1]}},12 async function callGAS(payload){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);try{const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload),signal:controller.signal});clearTimeout(timeout);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(data.ok===false)throw new Error(data.error||'Erreur GAS');return data}catch(e){clearTimeout(timeout);if(e.name==='AbortError')throw new Error('Timeout — réessaie');throw e}}function cleanHistory(h){return(h||[]).map(msg=>{if(!Array.isArray(msg.content))return msg;return{...msg,content:msg.content.map(b=>{if(b.type==='image')return{type:'text',text:'[image]'};if(b.type==='document')return{type:'text',text:'[document]'};return b})}})}function prepareFilesForApi(files){return Promise.all(files.map(f=>{if(!f.type||!f.type.startsWith('image/')||!f.data||f.data.length<=1_000_000)return Promise.resolve(f);return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve({...f,type:'image/jpeg',data:canvasCompress(img,400,.4)});img.onerror=()=>resolve(f);img.src='data:'+f.type+';base64,'+f.data})}))}
async function generer(){const chantier=document.getElementById('chantier').value.trim(),operateur=document.getElementById('operateur').value.trim(),observations=document.getElementById('observations').value.trim();currentChantier=chantier;currentOperateur=operateur;currentDocDate=new Date().toISOString().slice(0,10);document.getElementById('form-section').style.display='none';document.getElementById('loading').classList.add('visible');startProgress();try{const filesWithoutPhotos=currentFiles.filter(f=>!f.type||!f.type.startsWith('image/'));const data=await callGAS({type:selectedType,chantier,operateur,observations,files:filesWithoutPhotos,history:[]});conversationHistory=data.history;stopProgress();setTimeout(async()=>{afficherDoc(data.text);await sauvegarderAuto()},400)}catch(e){stopProgress();alert('Erreur génération : '+e.message);document.getElementById('form-section').style.display='block';document.getElementById('loading').classList.remove('visible')}}async function mettreAJour(){const modif=document.getElementById('modif-input').value.trim(),btn=document.querySelector('.btn-regen');btn.textContent='⏳ Mise à jour…';btn.disabled=true;try{if(modif){const data=await callGAS({modif,history:cleanHistory(conversationHistory)});conversationHistory=data.history;afficherDoc(data.text);document.getElementById('modif-input').value=''}await sauvegarderAuto();afficherPhotosDoc()}catch(e){alert('Erreur mise à jour : '+e.message)}finally{btn.textContent='🔄 Mettre à jour le document';btn.disabled=false}}
function afficherDoc(text){document.getElementById('loading').classList.remove('visible');document.getElementById('doc-result').style.display='';document.getElementById('doc-result').classList.add('visible');let html=`<div class="doc-type-header"><div class="type-full" style="font-size:11px;letter-spacing:2px;opacity:.7;margin-bottom:2px;">AB RENOV 35</div><div class="type-full">${(TYPE_LABELS[selectedType]||selectedType).toUpperCase()}</div></div>`,infos='';if(currentChantier)infos+=`<div class="doc-info-item">Chantier <span>${currentChantier}</span></div>`;if(currentOperateur)infos+=`<div class="doc-info-item">Opérateur <span>${currentOperateur}</span></div>`;infos+=`<div class="doc-info-item">Date <span>${new Date().toLocaleDateString('fr-FR')}</span></div>`;html+=`<div class="doc-info-bar">${infos}</div>`;const SKIP_EXACT=new Set(['compte rendu de chantier','compte rendu chantier','fiche chantier','fiche de chantier','procès-verbal de réception','procès verbal de réception','proces verbal de reception','pvr','fch','crch','première section','premier section','informations générales','informations generales','localisation et identification','identification','en-tête','entete']),SKIP_START=/^(chantier|opérateur|operateur|entreprise|lieu|client|rédacteur|redacteur|date|société|societe)\b\s*[:/]/i;let inSection=false;for(const line of text.split('\n')){const trimmed=line.trim();if(!trimmed)continue;const clean=trimmed.toLowerCase().replace(/[*#:\-_]/g,'').trim(),stripped=trimmed.replace(/\*\*/g,'').trim();if(trimmed.match(/^\.(jpeg|jpg|png|pdf|doc|docx)$/i)||trimmed.match(/^(WhatsApp Image|IMG_|DSC)/i)||trimmed.match(/^---+$/)||SKIP_EXACT.has(clean)||SKIP_START.test(stripped))continue;if(!inSection&&/^[A-ZÀ-Ÿa-zà-ÿ\s]{2,30}\s*:\s*.+$/.test(stripped)&&!stripped.match(/^#{1,3} /))continue;if(line.match(/^## /)||(trimmed.match(/^\*\*[^*]+\*\*$/)&&trimmed.length<80)){if(inSection){html+='</div></div>';inSection=false}const title=trimmed.replace(/^## /,'').replace(/\*\*/g async function getDropboxToken(){if(_dbxToken&&Date.now()<_dbxTokenExp)return _dbxToken;const res=await fetch('https://api.dropbox.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:DROPBOX_REFRESH_TOKEN,client_id:DROPBOX_APP_KEY,client_secret:DROPBOX_APP_SECRET})});if(!res.ok)throw new Error('Dropbox token: HTTP '+res.status);const d=await res.json();_dbxToken=d.access_token;_dbxTokenExp=Date.now()+((d.expires_in||14400)-60)*1000;return _dbxToken}async function uploadToDropbox(base64,filename){const token=await getDropboxToken(),binary=atob(base64),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const path=DROPBOX_FOLDER+filename,safePath=path.split('').map(c=>c.charCodeAt(0)>127?encodeURIComponent(c):c).join('');const res=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path:safePath,mode:'overwrite',autorename:false,mute:true})},body:bytes});if(!res.ok)throw new Error('Dropbox upload: HTTP '+res.status);const d=await res.json();return d.path_lower||path.toLowerCase()}async function getDropboxUrl(path){return'dropbox:'+path}async function resolveDropboxUrl(path){const d=await callGAS({action:'get_dropbox_link',path});return d.link}function setSavingUI(saving,label){const msg=document.getElementById('save-msg');if(saving){isSaving=true;msg.innerHTML=`<span class="save-pendule">🕰️</span> ${label||'Sauvegarde…'}`}else isSaving=false}
async function sauvegarderAuto(){if(!currentChantier)return;const msg=document.getElementById('save-msg');setSavingUI(true,'Sauvegarde…');const timestamp=Date.now(),photosAUploader=currentFiles.filter(f=>!f.url||!f.url.startsWith('dropbox:'));let dbxErrors=0;for(let i=0;i<photosAUploader.length;i++){setSavingUI(true,`☁️ Photo ${i+1}/${photosAUploader.length}…`);try{const filename=`photo-${timestamp}-${i}.jpg`,path=await uploadToDropbox(photosAUploader[i].data,filename),url=await getDropboxUrl(path),idx=currentFiles.indexOf(photosAUploader[i]);if(idx>=0){currentFiles[idx].url=url;currentFiles[idx].data=null}photosAUploader[i].url=url;photosAUploader[i].data=null}catch(e){dbxErrors++}}const clone=document.getElementById('doc-frame').cloneNode(true);clone.querySelectorAll('img.doc-photo').forEach(img=>img.remove());clone.querySelectorAll('.photo-section-title, .doc-photos').forEach(el=>el.remove());const contenu=clone.innerHTML,filesPayload=currentFiles.filter(f=>f.url&&f.url.startsWith('dropbox:')).map(f=>({name:f.name,type:f.type,url:f.url}));try{const data=await callGAS({action:currentDocId?'update':'save',id:currentDocId,type:selectedType,chantier:currentChantier,operateur:currentOperateur,date:new Date().toISOString().slice(0,10),contenu,files:filesPayload,history:cleanHistory(conversationHistory)});currentDocId=data.id||currentDocId;const errMsg=dbxErrors>0?` (${dbxErrors} photo(s) non uploadée(s))`:'';msg.innerHTML='<span class="save-badge save-badge-ok">✅ Sauvegardé'+errMsg+'</span>';isSaving=false;setSavingUI(false);setTimeout(()=>{msg.innerHTML=currentDocId?'<span class="save-badge save-badge-idle">✓ Sauvegardé</span>':''},4000)}catch(e){msg.innerHTML='<span class="save-badge save-badge-err">⚠️ '+e.message+'</span>';isSaving=false;setTimeout(()=>{msg.innerHTML=currentDocId?'<span class="save-badge save-badge-idle">✓ Sauvegardé</span>':''},4000)}}function sauvegarderDebounce(){clearTimeout(_saveDebounceTimer);_saveDebounceTimer=setTimeout(()=>sauvegarderAuto() async function partagerPDF(){const btn=document.querySelector('.btn-share'),original=btn.textContent;btn.disabled=true;btn.textContent='⏳ Génération du PDF…';try{const typeLabel=selectedType==='CRCh'?'CR_Chantier':selectedType==='FCh'?'Fiche_Chantier':'PV_Reception',dateStr=currentDocDate||new Date().toISOString().slice(0,10),fileName=`${dateStr}_${typeLabel}_${(currentChantier||'chantier').replace(/[^a-zA-Z0-9]+/g,'_')}.pdf`,source=document.getElementById('doc-frame'),canvas=await html2canvas(source,{scale:2,useCORS:true,backgroundColor:'#ffffff'}),imgData=canvas.toDataURL('image/jpeg',.92),{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight(),imgW=pageW,imgH=canvas.height*imgW/canvas.width;let heightLeft=imgH,position=0;pdf.addImage(imgData,'JPEG',0,position,imgW,imgH);heightLeft-=pageH;while(heightLeft>0){position=heightLeft-imgH;pdf.addPage();pdf.addImage(imgData,'JPEG',0,position,imgW,imgH);heightLeft-=pageH}const pdfBlob=pdf.output('blob'),pdfFile=new File([pdfBlob],fileName,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[pdfFile]}))await navigator.share({files:[pdfFile],title:fileName,text:`${typeLabel.replace(/_/g,' ')} — ${currentChantier||''}`});else if(navigator.share){const url=URL.createObjectURL(pdfBlob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}else pdf.save(fileName)}catch(err){if(err.name!=='AbortError'){console.error('Erreur partage PDF:',err);alert('Erreur lors de la génération du PDF : '+err.message)}}finally{btn.disabled=false;btn.textContent=original}}function imprimerDoc(){const typeLabel=selectedType==='CRCh'?'CR Chantier':selectedType==='FCh'?'Fiche Chantier':'PV Réception',dateParts=currentDocDate||new Date().toISOString().slice(0,10);document.title=dateParts+' - '+typeLabel+' - '+currentChantier+' - '+currentOperateur;window.addEventListener('afterprint',function restore(){document.title='AB RENOV 35 — Documents Chantier';window.removeEventListener('afterprint',restore)});setTimeout(()=>window.print(),200)}function showTab(tab){document.getElementById('tab-btn-nouveau').classList.toggle('active',tab==='nouveau');document.getElementById('tab-btn-liste').classList.toggle('active',tab==='liste');document.getElementById('tab-nouveau').style.display=tab==='nouveau'?'block':'none';document.getElementById('tab-liste').style.display=tab==='liste'?'block':'none';if(tab==='liste'){document.getElementById('doc-result').style.display='none';document.getElementById('doc-result').classList.remove('visible');document.getElementById('form-section').style.display='none';document.getElementById('loading').classList.remove('visible');chargerListe()}if(tab==='nouveau'){document.getElementById('chantier').value='';document.getElementById('operateur').value='';document.getElementById('observations').value='';document.getElementById('doc-result').classList.remove('visible');document.getElementById('loading').classList.remove('visible');document.getElementById('form-section').style.display='block';currentDocId=null;currentFiles=[];conversationHistory=[];currentChantier='';currentOperateur='';currentDocDate='';renderFilesList()}}async function chargerListe(){const container=document.getElementById('docs-list-container');container.innerHTML='<div class="empty-state">⏳ Chargement…</div>';try{const data=await callGAS({action:'list'});if(!data.docs||data.docs.length===0){container.innerHTML='<div class="empty-state">Aucun document sauvegardé</div>';return}container.innerHTML=`<div class="doc-list-wrap"><div class="doc-list-header"><div>Type</div><div>Chantier · Opérateur</div><div>Date</div><div style="text-align:right">Actions</div></div>${data.docs.map(d=>`<div class="doc-list-item"><div><span class="doc-type-badge">${TYPE_LABELS[d.type]||d.type}</span></div><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-spa getElementById('save-msg');msg.innerHTML='<span class="save-badge save-badge-saving">📄 Document chargé</span>';setTimeout(()=>msg.innerHTML='<span class="save-badge save-badge-idle">✓ Sauvegardé</span>',2000)}catch(e){alert('Erreur ouverture : '+e.message)}}async function supprimerDoc(id){if(!confirm('Supprimer ce document ?'))return;await callGAS({action:'delete',id});chargerListe()}
