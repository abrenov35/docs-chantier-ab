<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AB RENOV 35 — Documents Chantier</title>
<style>
:root {
  --navy: #162D49;
  --beige: #F3EAE2;
  --lav: #A495C3;
  --lav2: #7B6BA8;
  --white: #FFFFFF;
  --border: #DDD5CA;
  --muted: #8A9BAD;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--beige); font-family: 'Segoe UI', sans-serif; color: var(--navy); }

.header { background: var(--navy); padding: 14px 18px 0; position: sticky; top: 0; z-index: 100; }
.header-top { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; }
.logo-text { font-family: 'Century Gothic','Futura',sans-serif; font-weight: 800; font-size: 17px; color: var(--white); letter-spacing: 1px; }
.logo-sub { font-size: 9px; color: var(--lav); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
.header-band { height: 3px; background: linear-gradient(90deg, var(--lav), var(--lav2), var(--navy)); }

.main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
.section-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }

.type-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.type-btn { background: var(--white); border: 2px solid var(--border); border-radius: 10px; padding: 12px 6px; text-align: center; cursor: pointer; transition: all 0.15s; }
.type-btn.active { border-color: var(--navy); background: var(--navy); color: var(--white); }
.type-btn .code { font-weight: 800; font-size: 18px; display: block; margin-bottom: 4px; }
.type-btn .name { font-size: 11px; font-weight: 600; color: var(--muted); line-height: 1.3; }
.type-btn.active .name { color: rgba(255,255,255,0.85); }

.card { background: var(--white); border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); }
label { display: block; font-size: 11px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px; margin-top: 16px; }
label:first-child { margin-top: 0; }
input, textarea { width: 100%; padding: 11px 13px; border: 2px solid #C8D8E8; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit; background: #EEF4FA; color: var(--navy); outline: none; transition: border-color 0.15s, background 0.15s; }
input:focus, textarea:focus { border-color: var(--navy); background: #fff; }
input::placeholder, textarea::placeholder { color: #9AAFC0; font-weight: 400; }
textarea { resize: vertical; min-height: 90px; }

.btn-generate { width: 100%; padding: 14px; background: var(--navy); color: var(--white); border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; }
.btn-generate:disabled { opacity: 0.5; }

.file-btns { display: flex; gap: 8px; margin-bottom: 8px; }
.btn-file { flex: 1; padding: 12px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
.btn-photo { background: var(--navy); color: white; }
.btn-doc { background: var(--white); color: var(--navy); border: 2px solid var(--border) !important; }

.files-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.file-tag { background: #EDE9F4; color: var(--lav2); border-radius: 20px; padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.file-tag button { background: none; border: none; cursor: pointer; color: var(--lav2); font-size: 14px; padding: 0; line-height: 1; }

#loading { display: none; text-align: center; padding: 30px 16px; }
#loading.visible { display: block; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress-bar-wrap { background: var(--border); border-radius: 20px; height: 6px; margin: 12px 0 8px; overflow: hidden; }
.progress-bar { height: 6px; border-radius: 20px; background: linear-gradient(90deg, var(--lav), var(--navy)); width: 0%; transition: width 0.4s ease; }
.progress-step { font-size: 13px; color: var(--muted); min-height: 20px; }

#doc-result { display: none; }
#doc-result.visible { display: block; }

.doc-card { background: var(--white); border-radius: 10px; padding: 12px; border: 1px solid var(--border); margin-bottom: 14px; box-shadow: 0 2px 12px rgba(22,45,73,0.07); }
.doc-header-band { height: 3px; background: linear-gradient(90deg, var(--lav), var(--navy)); border-radius: 2px; margin-bottom: 8px; }
.doc-section { background: var(--white); border-radius: 6px; padding: 0; margin: 8px 0 2px; overflow: hidden; border: 1.5px solid var(--navy); }
.doc-section-title { font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #FFFFFF; background: var(--navy); padding: 6px 12px; margin-bottom: 0; }
.doc-section-body { padding: 7px 12px; }
.doc-section .doc-text { color: var(--navy); }
.doc-section .doc-bullet { color: var(--navy); }
.doc-section .doc-bullet::before { color: var(--lav2); }
.doc-text { font-size: 13px; line-height: 1.5; color: #1a1a2e; margin: 1px 0; }
.doc-text-plain { font-size: 13px; line-height: 1.5; color: #1a1a2e; margin: 1px 0; }
.doc-bullet { font-size: 13px; line-height: 1.5; color: #1a1a2e; padding-left: 14px; position: relative; margin: 1px 0; }
.doc-bullet::before { content: "▸"; position: absolute; left: 0; color: var(--lav2); font-size: 11px; top: 3px; }
.doc-title-main { font-family: 'Century Gothic','Futura',sans-serif; font-weight: 800; font-size: 18px; color: var(--navy); margin-bottom: 4px; }
.doc-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.doc-type-header { background: var(--navy); border-radius: 8px; padding: 9px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.doc-type-header .type-badge { background: var(--lav); color: var(--white); font-weight: 800; font-size: 13px; border-radius: 6px; padding: 4px 10px; letter-spacing: 1px; flex-shrink: 0; }
.doc-type-header .type-full { color: var(--white); font-weight: 800; font-size: 13px; letter-spacing: 1px; font-family: 'Century Gothic','Futura',sans-serif; text-transform: uppercase; }
.doc-photos { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.doc-photo { width: calc(33% - 6px); aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; transition: transform 0.15s; }
.doc-photo:hover { transform: scale(1.03); }
.photo-section-title { font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--lav2); margin-bottom: 8px; }
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }
.lightbox-close { position: absolute; top: 16px; right: 20px; color: white; font-size: 32px; cursor: pointer; }

.actions { display: flex; gap: 10px; margin-bottom: 14px; }
.btn-action { flex: 1; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
.btn-print { background: var(--navy); color: var(--white); }
.btn-reset { background: var(--white); color: var(--navy); border: 2px solid var(--border) !important; }

.modif-zone { background: var(--white); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
.btn-modif { width: 100%; padding: 11px; background: var(--lav); color: var(--white); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }

@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .header, .actions, .modif-zone, #form-section, #loading { display: none !important; }
  #doc-result { display: block !important; }
  body { background: white !important; }
  .main { padding: 0 !important; max-width: 100% !important; }
  .doc-card { border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; border-radius: 0 !important; }
  .doc-type-header { background: #162D49 !important; color: white !important; border-radius: 4px !important; }
  .doc-type-header .type-full { color: white !important; }
  .doc-section { background: white !important; border: 1.5px solid #162D49 !important; border-radius: 4px !important; break-inside: avoid; margin: 6px 0 !important; }
  .doc-section-title { background: #162D49 !important; color: white !important; }
  .doc-section .doc-text, .doc-section .doc-bullet { color: #162D49 !important; }
  .doc-photos { break-inside: avoid; }
  .doc-header-band { background: linear-gradient(90deg, #A495C3, #162D49) !important; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo-text">AB RENOV 35</div>
      <div class="logo-sub">Documents Chantier</div>
    </div>
  </div>
  <div class="header-band"></div>
</div>

<div class="main">

  <div id="form-section">
    <div class="section-label">Type de document</div>
    <div class="type-grid">
      <div class="type-btn active" data-type="CRCh" onclick="selectType(this)">
        <span class="code">CRCh</span>
        <span class="name">Compte Rendu de Chantier</span>
      </div>
      <div class="type-btn" data-type="FCh" onclick="selectType(this)">
        <span class="code">FCh</span>
        <span class="name">Fiche Chantier</span>
      </div>
      <div class="type-btn" data-type="PVR" onclick="selectType(this)">
        <span class="code">PVR</span>
        <span class="name">Procès-Verbal de Réception</span>
      </div>
    </div>

    <div class="card">
      <label>Chantier / Client</label>
      <input type="text" id="chantier" placeholder="Ex: Dupont — 12 rue des Lilas, Rennes">

      <label>Opérateur</label>
      <input type="text" id="operateur" placeholder="Ton prénom ou initiales">

      <label>Travaux réalisés / Observations</label>
      <textarea id="observations" placeholder="Décris les travaux du jour, observations, points importants…"></textarea>

      <label>Réserves / Problèmes (optionnel)</label>
      <textarea id="reserves" placeholder="Réserves, problèmes, points à surveiller…" style="min-height:60px"></textarea>

      <label>Photos / Documents (optionnel)</label>
      <div class="file-btns">
        <button type="button" class="btn-file btn-photo" onclick="document.getElementById('photo-input').click()">📷 Prendre des photos</button>
        <button type="button" class="btn-file btn-doc" onclick="document.getElementById('file-input').click()">📎 Ajouter des documents</button>
      </div>
      <div class="files-list" id="files-list"></div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" multiple style="display:none" onchange="handleFiles(this)">
      <input type="file" id="file-input" accept="image/*,application/pdf,.doc,.docx" multiple style="display:none" onchange="handleFiles(this)">
    </div>

    <button class="btn-generate" onclick="generer()">⚡ Générer le document</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="progress-step" id="progress-step">Envoi des données…</div>
  </div>

  <div id="doc-result">
    <div class="actions">
      <button class="btn-action btn-reset" onclick="resetForm()">← Retour</button>
      <button class="btn-action btn-print" onclick="imprimerDoc()">🖨️ Imprimer</button>
    </div>
    <div class="doc-card">
      <div class="doc-header-band"></div>
      <div id="doc-content"></div>
    </div>
    <div class="modif-zone">
      <div class="section-label">Modifier / Compléter</div>
      <textarea id="modif-input" placeholder="Ex: Ajoute une réserve sur la peinture du couloir…" style="min-height:60px;background:#EDE9F4;border-color:var(--lav)"></textarea>
      <button class="btn-modif" onclick="modifier()">✏️ Modifier le document</button>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <div class="lightbox-close">✕</div>
  <img id="lightbox-img" src="">
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxkxZ71UhLWUsq7DK5utewVbTcJGirALgQElAu9BgPOf7SwhTqwYsiM4w6vJemNc5ulmQ/exec';

let selectedType = 'CRCh';
let conversationHistory = [];
let currentFiles = []; // [{name, type, data}]

function selectType(el) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedType = el.dataset.type;
}

function handleFiles(input) {
  const files = Array.from(input.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      currentFiles.push({ name: file.name, type: file.type, data: e.target.result.split(',')[1] });
      renderFilesList();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function removeFile(idx) {
  currentFiles.splice(idx, 1);
  renderFilesList();
}

function renderFilesList() {
  const list = document.getElementById('files-list');
  list.innerHTML = currentFiles.map((f, i) =>
    `<div class="file-tag">📄 ${f.name} <button onclick="removeFile(${i})">✕</button></div>`
  ).join('');
}

async function callGAS(payload) {
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error);
  conversationHistory = data.history;
  return data.text;
}

let progressTimer = null;

function startProgress() {
  const steps = [
    [5, 'Envoi des données…'],
    [20, 'Analyse en cours…'],
    [45, 'Rédaction du document…'],
    [70, 'Mise en forme…'],
    [90, 'Finalisation…']
  ];
  let i = 0;
  const bar = document.getElementById('progress-bar');
  const step = document.getElementById('progress-step');
  bar.style.width = '5%';
  step.textContent = steps[0][1];
  progressTimer = setInterval(() => {
    i++;
    if (i < steps.length) {
      bar.style.width = steps[i][0] + '%';
      step.textContent = steps[i][1];
    }
  }, 1200);
}

function stopProgress() {
  clearInterval(progressTimer);
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('progress-step').textContent = 'Document prêt ✓';
}

async function generer() {
  const chantier = document.getElementById('chantier').value.trim();
  const operateur = document.getElementById('operateur').value.trim();
  const observations = document.getElementById('observations').value.trim();
  const reserves = document.getElementById('reserves').value.trim();

  if (!chantier || !observations) { alert('Chantier et observations obligatoires.'); return; }

  document.getElementById('form-section').style.display = 'none';
  document.getElementById('loading').classList.add('visible');
  startProgress();

  const payload = {
    type: selectedType,
    chantier, operateur, observations, reserves,
    files: currentFiles,
    history: []
  };

  try {
    const result = await callGAS(payload);
    stopProgress();
    setTimeout(() => afficherDoc(result), 400);
  } catch(e) {
    alert('Erreur : ' + e.message);
    resetForm();
  }
}

async function modifier() {
  const modif = document.getElementById('modif-input').value.trim();
  if (!modif) return;
  document.getElementById('modif-input').disabled = true;
  document.querySelector('.btn-modif').disabled = true;
  try {
    const result = await callGAS({ modif, history: conversationHistory });
    afficherDoc(result);
    document.getElementById('modif-input').value = '';
  } catch(e) {
    alert('Erreur : ' + e.message);
  } finally {
    document.getElementById('modif-input').disabled = false;
    document.querySelector('.btn-modif').disabled = false;
  }
}

function afficherDoc(text) {
  document.getElementById('loading').classList.remove('visible');
  document.getElementById('doc-result').classList.add('visible');
  const lines = text.split('\n');
  let html = '';
  let inSection = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    // Ignorer lignes parasites
    if (trimmed.match(/^---+$/)) continue;
    if (trimmed.match(/\.(jpeg|jpg|png|pdf|doc|docx|JPG|JPEG|PNG|PDF)$/i)) continue;
    if (trimmed.match(/^(WhatsApp Image|IMG_|DSC|DCIM)/i)) continue;
    if (trimmed === '·' || trimmed === '•' || trimmed === '-') continue;
    if (trimmed.match(/^(AB Renov|AB RENOV|Société)/i)) continue;
    if (trimmed.match(/^(Chantier\/Client|Opérateur|Lieu|Client|Rédacteur)\s*:/i)) continue;
    // Filtrer tout titre qui répète le type de document
    const cleanLine = trimmed.toLowerCase().replace(/[*#:\-_]/g,'').trim();
    const docTitles = ['compte rendu de chantier','compte rendu chantier','fiche chantier','fiche de chantier','procès verbal de réception','proces verbal de reception','pvr','fch','crch'];
    if (docTitles.some(t => cleanLine === t || cleanLine === t.toUpperCase())) continue;

    // Titre principal (# ou ## en début)
    if (line.match(/^# /)) {
      if (inSection) { html += '</div>'; inSection = false; }
      html += `<div class="doc-title-main">${line.replace(/^# /, '').replace(/\*\*/g,'')}</div>`;
    }
    // Section (## ou ### ou **TITRE** seul sur sa ligne)
    else if (line.match(/^#{2,3} /) || (line.match(/^\*\*[^*]+\*\*$/) && trimmed.length < 60)) {
      if (inSection) { html += '</div></div>'; inSection = false; }
      const title = line.replace(/^#{2,3} /, '').replace(/\*\*/g,'');
      html += `<div class="doc-section"><div class="doc-section-title">${title}</div><div class="doc-section-body">`;
      inSection = true;
    }
    // Ligne avec **gras** inline
    else if (trimmed.match(/\*\*/) && trimmed.length > 0) {
      const formatted = trimmed.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html += `<div class="${inSection ? 'doc-text' : 'doc-text-plain'}">${formatted}</div>`;
    }
    // Bullet point
    else if (trimmed.match(/^[-•·] /)) {
      const txt = trimmed.replace(/^[-•·] /, '').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html += `<div class="doc-bullet">${txt}</div>`;
    }
    // Ligne vide
    else if (!trimmed) {
      if (inSection) { html += '</div>'; inSection = false; }
      html += '<div style="height:8px"></div>';
    }
    // Texte normal
    else {
      const formatted = trimmed.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html += `<div class="${inSection ? 'doc-text' : 'doc-text-plain'}">${formatted}</div>`;
    }
  }
  if (inSection) html += '</div></div>';

  // Injecter titre type en haut
  const typeLabels2 = { CRCh: 'Compte Rendu de Chantier', FCh: 'Fiche Chantier', PVR: 'Procès-Verbal de Réception' };
  const typeHeader = `<div class="doc-type-header"><span class="type-full">${(typeLabels2[selectedType] || selectedType).toUpperCase()}</span></div>`;
  html = typeHeader + html;

  // Ajouter les photos en bas du document
  const photos = currentFiles.filter(f => f.type && f.type.startsWith('image/'));
  if (photos.length > 0) {
    html += '<div style="height:12px"></div>';
    html += '<div class="doc-section"><div class="doc-section-title">📷 Photos du chantier</div>';
    html += '<div class="doc-photos">';
    photos.forEach((f, i) => {
      html += `<img class="doc-photo" src="data:${f.type};base64,${f.data}" alt="${f.name}" onclick="openLightbox(${i})">`;
    });
    html += '</div></div>';
  }

  document.getElementById('doc-content').innerHTML = html;
}

function openLightbox(idx) {
  const photos = currentFiles.filter(f => f.type && f.type.startsWith('image/'));
  document.getElementById('lightbox-img').src = `data:${photos[idx].type};base64,${photos[idx].data}`;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function resetForm() {
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('doc-result').classList.remove('visible');
  document.getElementById('loading').classList.remove('visible');
  document.getElementById('modif-input').value = '';
  conversationHistory = [];
}

function imprimerDoc() { window.print(); }
</script>
</body>
</html>
