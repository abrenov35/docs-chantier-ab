<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AB RENOV 35 — Documents Chantier</title>
<style>
:root {
  --navy: #162D49;
  --beige: #F3EAE2;
  --lav: #A495C3;
  --lav2: #7B6BA8;
  --white: #FFFFFF;
  --border: #DDD5CA;
  --muted: #8A9BAD;
  --blue-light: #EEF4FA;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--beige); font-family: 'Segoe UI', sans-serif; color: var(--navy); }

.header { background: var(--navy); padding: 14px 18px 0; position: sticky; top: 0; z-index: 100; }
.header-top { display: flex; align-items: center; padding-bottom: 14px; }
.logo-text { font-family: 'Century Gothic','Futura',sans-serif; font-weight: 800; font-size: 17px; color: var(--white); letter-spacing: 1px; }
.logo-sub { font-size: 9px; color: var(--lav); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
.header-band { height: 3px; background: linear-gradient(90deg, var(--lav), var(--lav2), var(--navy)); }
.main { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }

.tabs { display: flex; gap: 10px; padding: 14px 0 16px; margin-bottom: 16px; }
.tab-btn { flex: 1; padding: 13px 8px; background: var(--white); border: 2px solid var(--border); border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; text-align: center; transition: all 0.2s; }
.tab-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

.section-label { font-size: 11px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 10px; }
.type-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.type-btn { background: var(--white); border: 2px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--navy); line-height: 1.3; }
.type-btn.active { border-color: var(--navy); background: var(--navy); color: var(--white); }
.card { background: var(--white); border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--border); }
label { display: block; font-size: 11px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px; margin-top: 16px; }
label:first-child { margin-top: 0; }
input, textarea { width: 100%; padding: 11px 13px; border: 2px solid #C8D8E8; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: inherit; background: var(--blue-light); color: var(--navy); outline: none; }
input:focus, textarea:focus { border-color: var(--navy); background: #fff; }
input::placeholder, textarea::placeholder { color: #9AAFC0; font-weight: 400; }
textarea { resize: vertical; min-height: 90px; }

.file-btns { display: flex; gap: 8px; margin-bottom: 8px; }
.btn-file { flex: 1; padding: 12px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
.btn-photo { background: var(--navy); color: white; }
.btn-doc { background: var(--white); color: var(--navy); border: 2px solid var(--border) !important; }
.files-list { display: flex; flex-wrap: wrap; gap: 6px; }
.file-tag { background: #EDE9F4; color: var(--lav2); border-radius: 20px; padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.file-tag button { background: none; border: none; cursor: pointer; color: var(--lav2); font-size: 14px; padding: 0; }

.btn-generate { width: 100%; padding: 15px; background: var(--navy); color: var(--white); border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; }

#loading { display: none; text-align: center; padding: 40px 0; }
#loading.visible { display: block; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress-bar-wrap { background: var(--border); border-radius: 20px; height: 6px; overflow: hidden; flex: 1; }
.progress-bar { height: 6px; border-radius: 20px; background: linear-gradient(90deg, var(--lav), var(--navy)); width: 0%; transition: width 0.4s ease; }

#doc-result { display: none; }
#doc-result.visible { display: block; }
.actions { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.btn-action { flex: 1; padding: 11px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
.btn-retour { background: var(--white); color: var(--navy); border: 2px solid var(--border) !important; }
.btn-print { background: var(--navy); color: white; }
#save-msg { flex: 1; font-size: 11px; text-align: center; min-height: 18px; }
.save-pendule { display: inline-block; animation: pendule 0.6s ease-in-out infinite alternate; transform-origin: top center; }
@keyframes pendule { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }



#doc-frame { border: 2.5px solid var(--navy); border-radius: 6px; overflow: hidden; margin-bottom: 14px; background: white; }
.doc-type-header { background: var(--navy); padding: 10px 16px; }
.doc-type-header .type-full { color: var(--white); font-weight: 800; font-size: 14px; letter-spacing: 1px; font-family: 'Century Gothic','Futura',sans-serif; text-transform: uppercase; }
.doc-info-bar { background: var(--blue-light); padding: 7px 16px; display: flex; gap: 16px; flex-wrap: wrap; }
.doc-info-item { font-size: 12px; color: var(--navy); font-weight: 700; }
.doc-info-item span { font-weight: 400; }
#doc-content { padding: 4px 0; }

.doc-section { background: var(--white); padding: 0; margin: 8px 0; box-shadow: 0 1px 4px rgba(22,45,73,0.10); }
.doc-section-title { font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--white); background: var(--navy); padding: 7px 16px; }
.doc-subsection-title { font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--navy); background: #DDD7EC; padding: 5px 16px; border-left: 3px solid var(--lav2); }
.doc-section-body { padding: 8px 16px 10px; }
.doc-text { font-size: 13px; line-height: 1.6; color: var(--navy); margin: 3px 0; }
.doc-text-plain { font-size: 13px; line-height: 1.6; color: var(--navy); margin: 3px 0; padding: 0 16px; }
.doc-bullet { font-size: 13px; line-height: 1.6; color: var(--navy); padding-left: 28px; position: relative; margin: 2px 0; }
.doc-bullet::before { content: "▸"; position: absolute; left: 16px; color: var(--lav2); font-size: 11px; top: 2px; }

.doc-photos { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 12px; }
.doc-photo { width: calc(33% - 6px); aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; cursor: pointer; }
.photo-section-title { background: var(--navy); padding: 7px 16px; font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: white; margin-top: 8px; }
.doc-photo-block { padding: 4px 0; }

.modif-zone { background: var(--white); border-radius: 12px; padding: 16px; border: 1px solid var(--border); margin-top: 14px; }
.btn-modif { width: 100%; padding: 11px; background: var(--lav); color: var(--white); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; }
.btn-regen { width: 100%; padding: 11px; background: var(--navy); color: var(--white); border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }

.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }
.lightbox-close { position: absolute; top: 16px; right: 20px; color: white; font-size: 32px; cursor: pointer; }

.doc-list-wrap { background: var(--white); border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border); }
.doc-list-header { display: grid; grid-template-columns: 130px 1fr 72px 80px; gap: 6px; padding: 6px 12px; font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--border); }
.doc-list-item { display: grid; grid-template-columns: 130px 1fr 72px 80px; gap: 6px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.doc-list-item:last-child { border-bottom: none; }
.doc-type-badge { font-size: 8px; font-weight: 800; background: var(--navy); color: white; border-radius: 3px; padding: 2px 5px; display: inline-block; white-space: normal; line-height: 1.2; }
.doc-list-actions { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
.doc-list-actions button { background: none; border: none; cursor: pointer; font-size: 18px; padding: 5px 7px; border-radius: 6px; }
.doc-list-actions .btn-delete { color: #c0392b; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

<div class="header">

      <div class="logo-text">AB RENOV 35</div>

<script>

const TYPE_LABELS = { CRCh: 'Compte Rendu de Chantier', FCh: 'Fiche Chantier', PVR: 'Procès-Verbal de Réception' };
const TYPE_SHORT  = { CRCh: 'CR Chantier', FCh: 'Fiche Chantier', PVR: 'PV Réception' };

const DROPBOX_APP_KEY       = 'npkaaglhu1pg76f';
const DROPBOX_APP_SECRET    = 'jrotkenty0xbblm';
const DROPBOX_REFRESH_TOKEN = 'NgaR3TStT4IAAAAAAAAAARqPWRHst_DHSe57Ggb2wdKTceyP5GMQOcDWLN94DrCR';
const DROPBOX_FOLDER        = '/AB RENOV 35/CLIENTS AB RENOV 35/SUIVI CHANTIER - DOCS/photos/';

// ── État global ──────────────────────────────────
let selectedType = 'CRCh';
let conversationHistory = [];
let currentFiles  = [];   // { name, type, data (base64), url (Dropbox) }
let currentDocId  = null;
let currentChantier  = '';
let currentOperateur = '';
let currentDocDate   = '';
let progressTimer = null;
let _pendingLabelFiles = [];   // queue photos en attente de label
let _modeModification = false; // true pendant une modif → photos non regroupées en bas
let _pendingLabelResolve = null; // resolve de la Promise courante
let isSaving = false;
let _dbxToken    = null;
let _dbxTokenExp = 0;
let _saveDebounceTimer = null;
let _modeModification = false;

// pas de blocage beforeunload

// ── Type ─────────────────────────────────────────
function selectType(el) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  selectedType = el.dataset.type;
}

// ── Compression image ────────────────────────────
function canvasCompress(img, maxPx, quality) {
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  if (w >= h ? w > maxPx : h > maxPx) {
    if (w >= h) { h = Math.round(h * maxPx / w); w = maxPx; }
    else        { w = Math.round(w * maxPx / h); h = maxPx; }
  }
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality).split(',')[1];
}

function compressImage(file, callback) {
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = function() {
    URL.revokeObjectURL(url);
    let data = canvasCompress(img, 800, 0.5);
    if (data.length > 1_000_000) data = canvasCompress(img, 400, 0.4);
    callback({ name: file.name, type: 'image/jpeg', data });
  };
  img.onerror = function() {
    URL.revokeObjectURL(url);
    const r = new FileReader();
    r.onload = e => callback({ name: file.name, type: file.type, data: e.target.result.split(',')[1] });
    r.onerror = () => callback({ name: file.name, type: file.type, data: '' });
    r.readAsDataURL(file);
  };
  img.src = url;
}

async function handleFiles(input) {
  const files = Array.from(input.files).slice(0, 3);
  const existingPhotos = currentFiles.filter(f => f.type && f.type.startsWith('image/')).length;
  const newPhotos = files.filter(f => f.type.startsWith('image/')).length;
  if (existingPhotos + newPhotos > 6) { alert('Maximum 6 photos.'); input.value = ''; return; }
  for (let i = 0; i < files.length; i++) {
    if (i > 0) await new Promise(r => setTimeout(r, 300));
    const file = files[i];
    if (file.type.startsWith('image/')) {
      const c = await new Promise(resolve => compressImage(file, resolve));
      const label = await askPhotoLabel(file.name);
      c.label = label;
      currentFiles.push(c);
    } else {
      const data = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result.split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      currentFiles.push({ name: file.name, type: file.type, data });
    }
    renderFilesList();
  }
  input.value = '';
}

// ── Appel GAS ────────────────────────────────────
async function callGAS(payload) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 25000);
  try {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload), signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.ok === false) throw new Error(data.error || 'Erreur GAS');
    return data;
  } catch(e) {
    clearTimeout(timeout);
    if (e.name === 'AbortError') throw new Error('Timeout — réessaie');
    throw e;
  }
}

// Purger images base64 de l'historique (trop lourd pour GAS)
function cleanHistory(h) {
  return (h || [])
    .map(msg => {
      // Nettoyer le contenu des blocs
      if (Array.isArray(msg.content)) {
        return { ...msg, content: msg.content.map(b => {
          if (b.type === 'image') return { type: 'text', text: '[image]' };
          if (b.type === 'document') return { type: 'text', text: '[document]' };
          return b;
        })};
      }
      // Supprimer les rappels photos des messages texte (évite que Claude y réponde)
      if (typeof msg.content === 'string') {
        const cleaned = msg.content
          .replace(/\n\n\[RAPPEL PHOTOS EXISTANTES\][\s\S]*$/i, '')
          .replace(/\n\n\[PHOTOS JOINTES[^\]]*\][\s\S]*$/i, '')
          .trim();
        return { ...msg, content: cleaned };
      }
      return msg;
    })
    .filter(msg => {
      const txt = typeof msg.content === 'string' ? msg.content : '';
      return txt.length > 0 || Array.isArray(msg.content);
    });
}

// ── Filtre images avant envoi API ────────────────
// Recompresse toute image dont le base64 dépasse 1 MB.
function prepareFilesForApi(files) {
  return Promise.all(files.map(f => {
    if (!f.type || !f.type.startsWith('image/') || !f.data || f.data.length <= 1_000_000)
      return Promise.resolve(f);
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve({ ...f, type: 'image/jpeg', data: canvasCompress(img, 400, 0.4) });
      img.onerror = () => resolve(f);
      img.src = 'data:' + f.type + ';base64,' + f.data;
    });
  }));
}

// ── Afficher doc ─────────────────────────────────
function afficherDoc(text) {
  document.getElementById('loading').classList.remove('visible');
  document.getElementById('doc-result').style.display = '';
  document.getElementById('doc-result').classList.add('visible');

  // En-tête
  let html = `<div class="doc-type-header"><div class="type-full">${(TYPE_LABELS[selectedType]||selectedType).toUpperCase()}</div></div>`;
  let infos = '';
  if (currentChantier)  infos += `<div class="doc-info-item">Chantier <span>${currentChantier}</span></div>`;
  if (currentOperateur) infos += `<div class="doc-info-item">Opérateur <span>${currentOperateur}</span></div>`;
  infos += `<div class="doc-info-item">Date <span>${new Date().toLocaleDateString('fr-FR')}</span></div>`;
  html += `<div class="doc-info-bar">${infos}</div>`;

  // Filtres
  const SKIP_EXACT  = new Set(['compte rendu de chantier','compte rendu chantier','fiche chantier','fiche de chantier','procès-verbal de réception','procès verbal de réception','proces verbal de reception','pvr','fch','crch','première section','premier section','informations générales','informations generales','localisation et identification','identification','en-tête','entete']);
  const SKIP_START  = /^(chantier|opérateur|operateur|entreprise|lieu|client|rédacteur|redacteur|date|société|societe)\b\s*[:/]/i;

  let inSection = false;
  for (const line of text.split('\n')) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const clean   = trimmed.toLowerCase().replace(/[*#:\-_]/g,'').trim();
    const stripped = trimmed.replace(/\*\*/g,'').trim();
    if (trimmed.match(/^\.(jpeg|jpg|png|pdf|doc|docx)$/i)) continue;
    if (trimmed.match(/^(WhatsApp Image|IMG_|DSC)/i)) continue;
    if (trimmed.match(/^---+$/)) continue;
    if (SKIP_EXACT.has(clean)) continue;
    if (SKIP_START.test(stripped)) continue;
    if (!inSection && /^[A-ZÀ-Ÿa-zà-ÿ\s]{2,30}\s*:\s*.+$/.test(stripped) && !stripped.match(/^#{1,3} /)) continue;

    const photoMatch = trimmed.match(/^\[PHOTO:([^\]]+)\]$/);
    if (photoMatch) { html += `<span class="photo-marker" data-label="${photoMatch[1]}"></span>`; continue; }

    if (line.match(/^## /) || (trimmed.match(/^\*\*[^*]+\*\*$/) && trimmed.length < 80)) {
      if (inSection) { html += '</div></div>'; inSection = false; }
      const title = trimmed.replace(/^## /,'').replace(/\*\*/g,'');
      if (SKIP_EXACT.has(title.toLowerCase())) continue;
      html += `<div class="doc-section"><div class="doc-section-title">${title}</div><div class="doc-section-body">`;
      inSection = true;
    } else if (line.match(/^### /)) {
      html += `<div class="doc-subsection-title">${trimmed.replace(/^### /,'')}</div>`;
    } else if (trimmed.match(/^[-•·▸] /)) {
      html += `<div class="doc-bullet">${trimmed.replace(/^[-•·▸] /,'').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}</div>`;
    } else {
      const fmt = trimmed.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
      html += inSection ? `<div class="doc-text">${fmt}</div>` : `<div class="doc-text-plain">${fmt}</div>`;
    }
  }
  if (inSection) html += '</div></div>';

  const docContent = document.getElementById('doc-content');

  // En mode modification : sauvegarder les blocs photos actuels avant écrasement
  let blocksAvant = [];
  if (_modeModification) {
    docContent.querySelectorAll('.doc-photo-block').forEach(bloc => {
      const cap = bloc.querySelector('div');
      const label = cap ? cap.textContent.trim() : '';
      const photo = currentFiles.find(f => (f.label||'') === label);
      if (photo) blocksAvant.push({ label, photo, nextSibling: bloc.nextSibling, parent: bloc.parentNode });
    });
  }

  docContent.innerHTML = html;
  docContent.setAttribute('data-chantier', currentChantier);
  docContent.setAttribute('data-date', new Date().toLocaleDateString('fr-FR'));
  // Pied de page PDF
  const docFrame = document.getElementById('doc-frame');
  docFrame.setAttribute('data-footer', currentChantier + (currentOperateur ? '  ·  ' + currentOperateur : '') + '  ·  ' + new Date().toLocaleDateString('fr-FR'));

  if (_modeModification && blocksAvant.length > 0) {
    // Tenter les marqueurs [PHOTO:label] dans le nouveau texte
    injecterPhotosMarqueurs();
    // Si aucun bloc photo injecté → réinjecter les photos à la fin, inline
    if (docContent.querySelectorAll('.doc-photo-block').length === 0) {
      blocksAvant.forEach(({ photo }) => {
        docContent.appendChild(creerBlocPhoto(photo));
      });
    }
  } else {
    injecterPhotosMarqueurs();
  }
}

// ── Injection photos aux marqueurs ───────────────
function injecterPhotosMarqueurs() {
  const docFrame = document.getElementById('doc-frame');
  if (!docFrame) return;

  const photos = currentFiles.filter(f => f.type && f.type.startsWith('image/'));
  if (photos.length === 0) return;

  // Supprimer anciens blocs photos (seront réinjectés aux marqueurs)
  docFrame.querySelectorAll('.photo-section-title, .doc-photos, .doc-photo-block').forEach(el => el.remove());

  // Chercher les marqueurs [PHOTO:label] dans les noeuds texte
  const placees = new Set();

  function remplacerMarqueursDansEl(el) {
    Array.from(el.childNodes).forEach(node => {
      if (node.nodeType === 3) {
        const txt = node.textContent;
        const re = /\[PHOTO:([^\]]+)\]/gi;
        let match;
        let lastIdx = 0;
        const frag = document.createDocumentFragment();
        let found = false;
        while ((match = re.exec(txt)) !== null) {
          found = true;
          const label = match[1].trim().toLowerCase();
          if (match.index > lastIdx) frag.appendChild(document.createTextNode(txt.slice(lastIdx, match.index)));
          const photo = photos.find(f => (f.label||'').toLowerCase() === label);
          if (photo) { placees.add(photo); frag.appendChild(creerBlocPhoto(photo)); }
          lastIdx = match.index + match[0].length;
        }
        if (found) {
          if (lastIdx < txt.length) frag.appendChild(document.createTextNode(txt.slice(lastIdx)));
          node.parentNode.replaceChild(frag, node);
        }
      } else if (node.nodeType === 1 && !node.classList.contains('doc-photo-block')) {
        remplacerMarqueursDansEl(node);
      }
    });
  }

  remplacerMarqueursDansEl(docFrame);

  // Photos sans marqueur
  const restantes = photos.filter(p => !placees.has(p));
  if (restantes.length === 0) return;

  if (_modeModification) {
    // En mode modification : si Claude n'a placé aucun marqueur → ne rien faire
    // Les photos restent où elles étaient (le HTML sauvegardé contient les marqueurs)
    if (placees.size === 0) return;
    // Sinon placer les restantes après la dernière photo placée
    const allBlocks = docFrame.querySelectorAll('.doc-photo-block');
    const lastBlock = allBlocks[allBlocks.length - 1];
    restantes.forEach(f => {
      const bloc = creerBlocPhoto(f);
      if (lastBlock && lastBlock.parentNode) lastBlock.parentNode.insertBefore(bloc, lastBlock.nextSibling);
      else (document.getElementById('doc-content') || docFrame).appendChild(bloc);
    });
    return;
  }

  // Mode normal (première génération) → bas de page si aucun marqueur
  if (placees.size === 0) {
    const target = document.getElementById('doc-content') || docFrame;
    const titleEl = document.createElement('div');
    titleEl.className = 'photo-section-title';
    titleEl.textContent = '📷 Photos du chantier';
    const gridEl = document.createElement('div');
    gridEl.className = 'doc-photos';
    restantes.forEach(f => gridEl.appendChild(creerBlocPhoto(f)));
    target.appendChild(titleEl);
    target.appendChild(gridEl);
  } else {
    const allBlocks = docFrame.querySelectorAll('.doc-photo-block');
    const lastBlock = allBlocks[allBlocks.length - 1];
    restantes.forEach(f => {
      const bloc = creerBlocPhoto(f);
      if (lastBlock && lastBlock.parentNode) lastBlock.parentNode.insertBefore(bloc, lastBlock.nextSibling);
      else (document.getElementById('doc-content') || docFrame).appendChild(bloc);
    });
  }
}

function creerBlocPhoto(f) {
  const wrap = document.createElement('div');
  wrap.className = 'doc-photo-block';
  wrap.style.cssText = 'margin:12px 0;text-align:center;';
  const img = document.createElement('img');
  img.className = 'doc-photo';
  img.style.maxWidth = '100%';
  const idx = currentFiles.filter(x=>x.type&&x.type.startsWith('image/')).indexOf(f);
  img.onclick = () => openLightbox(idx);
  if (f.url && f.url.startsWith('dropbox:')) {
    resolveDropboxUrl(f.url.replace('dropbox:', '')).then(link => { img.src = link; });
  } else {
    img.src = f.url || (f.data ? `data:${f.type};base64,${f.data}` : '');
  }
  wrap.appendChild(img);
  if (f.label) {
    const cap = document.createElement('div');
    cap.style.cssText = 'font-size:11px;color:#888;margin-top:4px;font-style:italic;';
    cap.textContent = f.label;
    wrap.appendChild(cap);
  }
  return wrap;
}

// Compat — appelé depuis ouvrirDoc et autres endroits
function afficherPhotosDoc() { injecterPhotosMarqueurs(); }

// ── Dropbox ──────────────────────────────────────
async function getDropboxToken() {
  if (_dbxToken && Date.now() < _dbxTokenExp) return _dbxToken;
  const res = await fetch('https://api.dropbox.com/oauth2/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type:    'refresh_token',
      refresh_token: DROPBOX_REFRESH_TOKEN,
      client_id:     DROPBOX_APP_KEY,
      client_secret: DROPBOX_APP_SECRET
    })
  });
  if (!res.ok) throw new Error('Dropbox token: HTTP ' + res.status);
  const d = await res.json();
  _dbxToken    = d.access_token;
  _dbxTokenExp = Date.now() + ((d.expires_in || 14400) - 60) * 1000;
  return _dbxToken;
}

async function uploadToDropbox(base64, filename) {
  console.log('Début upload', filename);
  const token  = await getDropboxToken();
  console.log('Token obtenu:', token ? 'OK' : 'ECHEC');
  const binary = atob(base64);
  const bytes  = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const path     = DROPBOX_FOLDER + filename;
  const safePath = path.split('').map(c => c.charCodeAt(0) > 127 ? encodeURIComponent(c) : c).join('');
  const res = await fetch('https://content.dropboxapi.com/2/files/upload', {
    method: 'POST',
    headers: {
      'Authorization':   'Bearer ' + token,
      'Content-Type':    'application/octet-stream',
      'Dropbox-API-Arg': JSON.stringify({ path: safePath, mode: 'overwrite', autorename: false, mute: true })
    },
    body: bytes
  });
  if (!res.ok) throw new Error('Dropbox upload: HTTP ' + res.status);
  const d = await res.json();
  console.log('Upload result:', res.status, d);
  return d.path_lower || path.toLowerCase();
}

async function getDropboxUrl(path) {
  return 'dropbox:' + path;
}

async function resolveDropboxUrl(path) {
  // Passe par le GAS (CORS bloque l'appel direct depuis le navigateur)
  const d = await callGAS({ action: 'get_dropbox_link', path });
  return d.link;
}

function setSavingUI(saving, label) {
  const msg = document.getElementById('save-msg');
  const btnPhoto = document.getElementById('modif-photo-input');
  const btnDoc   = document.getElementById('modif-doc-input');
  const btnModif = document.querySelector('.btn-modif');
  if (saving) {
    isSaving = true;
    msg.innerHTML = `<span class="save-pendule">🕰️</span> ${label || 'Sauvegarde…'}`;
    // Ne pas bloquer les boutons — juste indiquer visuellement
  } else {
    isSaving = false;
  }
}

// ── Sauvegarde auto ──────────────────────────────
// Sauvegarde silencieuse déclenchée à la navigation (sans upload photos)
async function sauvegarderSilencieux() {
  if (!currentDocId || !currentChantier) return;
  try {
    const clone = document.getElementById('doc-frame').cloneNode(true);
    clone.querySelectorAll('.doc-photo-block').forEach(bloc => {
      const cap = bloc.querySelector('div');
      const label = cap ? cap.textContent.trim() : '';
      bloc.parentNode.replaceChild(document.createTextNode('[PHOTO:' + label + ']'), bloc);
    });
    clone.querySelectorAll('.photo-section-title, .doc-photos').forEach(el => el.remove());
    clone.querySelectorAll('img.doc-photo').forEach(img => img.remove());
    const contenu = clone.innerHTML;
    const filesPayload = currentFiles
      .filter(f => f.url && f.url.startsWith('dropbox:'))
      .map(f => ({ name: f.name, type: f.type, url: f.url }));
    const cleanHistory = (conversationHistory || []).map(m => ({
      role: m.role,
      content: typeof m.content === 'string' ? m.content
        : (m.content || []).filter(b => b.type === 'text').map(b => b.text).join('')
    })).filter(m => m.content);
    await callGAS({
      action: 'update', id: currentDocId,
      type: selectedType, chantier: currentChantier,
      operateur: currentOperateur,
      date: new Date().toISOString().slice(0,10),
      contenu, files: filesPayload, history: cleanHistory
    });
    const msg = document.getElementById('save-msg');
    if (msg) msg.innerHTML = '<span class="save-badge save-badge-idle">✓ Sauvegardé</span>';
  } catch(e) {
    console.warn('Sauvegarde silencieuse échouée:', e.message);
  }
}

async function sauvegarderAuto() {
  if (!currentChantier) return;
  const msg = document.getElementById('save-msg');
  setSavingUI(true, 'Sauvegarde…');

  const timestamp = Date.now();

  // Photos déjà sur Dropbox — conserver telles quelles
  const photosExistantes = currentFiles
    .filter(f => f.url && f.url.startsWith('dropbox:'));

  // Nouvelles photos (base64, pas encore uploadées)
  const photosAUploader = currentFiles
    .filter(f => !f.url || !f.url.startsWith('dropbox:'));

  let dbxErrors = 0;
  const nouvellesUploadees = [];

  for (let i = 0; i < photosAUploader.length; i++) {
    setSavingUI(true, `☁️ Photo ${i + 1}/${photosAUploader.length}…`);
    try {
      const filename = `photo-${timestamp}-${i}.jpg`;
      const path = await uploadToDropbox(photosAUploader[i].data, filename);
      const url  = await getDropboxUrl(path);
      const idx  = currentFiles.indexOf(photosAUploader[i]);
      if (idx >= 0) { currentFiles[idx].url = url; currentFiles[idx].data = null; }
      photosAUploader[i].url = url; photosAUploader[i].data = null;
      nouvellesUploadees.push({ name: photosAUploader[i].name, type: photosAUploader[i].type, url });
      console.log('URL stockée:', url);
    } catch(e) {
      dbxErrors++;
      console.log('ERREUR upload:', e.message);
      console.error('Dropbox upload erreur [' + i + ']:', e.message);
    }
  }

  // Contenu HTML : remplacer les blocs photos par leurs marqueurs [PHOTO:label] pour persistence
  const clone = document.getElementById('doc-frame').cloneNode(true);
  // Remplacer chaque doc-photo-block par son marqueur texte
  clone.querySelectorAll('.doc-photo-block').forEach(bloc => {
    const cap = bloc.querySelector('div');
    const label = cap ? cap.textContent.trim() : '';
    const marker = document.createTextNode('[PHOTO:' + label + ']');
    bloc.parentNode.replaceChild(marker, bloc);
  });
  // Supprimer les sections photos groupées (sans marqueurs individuels)
  clone.querySelectorAll('.photo-section-title, .doc-photos').forEach(el => el.remove());
  clone.querySelectorAll('img.doc-photo').forEach(img => img.remove());
  const contenu = clone.innerHTML;

  const filesPayload = currentFiles
    .filter(f => f.url && f.url.startsWith('dropbox:'))
    .map(f => ({ name: f.name, type: f.type, url: f.url }));
  console.log('filesPayload envoyé au GAS:', JSON.stringify(filesPayload));

  // Étape 2 : sauvegarder texte + URLs + history dans GAS
  try {
    console.log('ACTION GAS:', currentDocId ? 'update' : 'save', 'ID:', currentDocId);
    console.log('FILES PAYLOAD:', JSON.stringify(filesPayload));
    const data = await callGAS({
      action:    currentDocId ? 'update' : 'save',
      id:        currentDocId,
      type:      selectedType,
      chantier:  currentChantier,
      operateur: currentOperateur,
      date:      new Date().toISOString().slice(0,10),
      contenu,
      files:     filesPayload,
      history:   cleanHistory(conversationHistory)
    });
    currentDocId = data.id || currentDocId;
    const errMsg = dbxErrors > 0 ? ` (${dbxErrors} photo(s) non uploadée(s))` : '';
    msg.innerHTML = '<span class="save-badge save-badge-ok">✅ Sauvegardé' + errMsg + '</span>';
    isSaving = false;
    setSavingUI(false);
    setTimeout(() => {
      const msg = document.getElementById('save-msg');
      msg.innerHTML = currentDocId ? '<span class="save-badge save-badge-idle">✓ Sauvegardé</span>' : '';
    }, 4000);
  } catch(e) {
    msg.innerHTML = '<span class="save-badge save-badge-err">⚠️ ' + e.message + '</span>';
    console.error('sauvegarderAuto GAS:', e);
    isSaving = false;
    setTimeout(() => { msg.innerHTML = currentDocId ? '<span class="save-badge save-badge-idle">✓ Sauvegardé</span>' : ''; }, 4000);
  }
}

function sauvegarderDebounce() {
  clearTimeout(_saveDebounceTimer);
  _saveDebounceTimer = setTimeout(() => sauvegarderAuto(), 800);
}

// ── Reset ────────────────────────────────────────
function resetForm() {
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('doc-result').classList.remove('visible');
  document.getElementById('doc-result').style.display = 'none';
  document.getElementById('loading').classList.remove('visible');
  document.getElementById('modif-input').value = '';
  document.getElementById('save-msg').innerHTML = '';
  conversationHistory  = [];
  currentDocId         = null;
  currentChantier      = '';
  currentOperateur     = '';
  currentDocDate       = '';
  currentFiles         = [];
  renderFilesList();
}

// ── Imprimer ─────────────────────────────────────
function imprimerDoc() {
  const typeLabel = selectedType === 'CRCh' ? 'CR Chantier' : selectedType === 'FCh' ? 'Fiche Chantier' : 'PV Réception';
  const dateParts = currentDocDate || new Date().toISOString().slice(0, 10);
  document.title = dateParts + ' - ' + typeLabel + ' - ' + currentChantier + ' - ' + currentOperateur;
  window.addEventListener('afterprint', function restore() {
    document.title = 'AB RENOV 35 — Documents Chantier';
    window.removeEventListener('afterprint', restore);
  });
  setTimeout(() => window.print(), 200);
}

// ── Onglets ──────────────────────────────────────
function showTab(tab) {
  // navigation libre même pendant sauvegarde
  document.getElementById('tab-btn-nouveau').classList.toggle('active', tab === 'nouveau');
  document.getElementById('tab-btn-liste').classList.toggle('active', tab === 'liste');
  document.getElementById('tab-nouveau').style.display = tab === 'nouveau' ? 'block' : 'none';
  document.getElementById('tab-liste').style.display   = tab === 'liste'   ? 'block' : 'none';
  if (tab === 'liste') {
    // Sauvegarde automatique si un doc est ouvert
    if (currentDocId) sauvegarderSilencieux();
    document.getElementById('doc-result').style.display = 'none';
    document.getElementById('doc-result').classList.remove('visible');
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('loading').classList.remove('visible');
    chargerListe();
  }
  if (tab === 'nouveau') {
    document.getElementById('chantier').value    = '';
    document.getElementById('operateur').value   = '';
    document.getElementById('observations').value = '';
    document.getElementById('doc-result').classList.remove('visible');
    document.getElementById('loading').classList.remove('visible');
    document.getElementById('form-section').style.display = 'block';
    currentDocId = null; currentFiles = []; conversationHistory = [];
    currentChantier = ''; currentOperateur = ''; currentDocDate = '';
    renderFilesList();
  }
}

// ── Liste documents ───────────────────────────────
async function chargerListe() {
  const container = document.getElementById('docs-list-container');
  container.innerHTML = '<div class="empty-state">⏳ Chargement…</div>';
  try {
    const data = await callGAS({ action: 'list' });
    if (!data.docs || data.docs.length === 0) {
      container.innerHTML = '<div class="empty-state">Aucun document sauvegardé</div>';
      return;
    }
    container.innerHTML = `<div class="doc-list-wrap">
      <div class="doc-list-header"><div>Type</div><div>Chantier · Opérateur</div><div>Date</div><div style="text-align:right">Actions</div></div>
      ${data.docs.map(d => `
      <div class="doc-list-item">
        <div><span class="doc-type-badge">${TYPE_LABELS[d.type]||d.type}</span></div>
        <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.chantier||'—'} <span style="font-weight:400;color:var(--muted)">· ${d.operateur||''}</span></div>
        <div style="color:var(--muted);font-size:12px">${(d.date||'').slice(0,10).split('-').reverse().join('/')}</div>
        <div class="doc-list-actions">
          <button title="Ouvrir / Modifier" onclick="ouvrirDoc('${d.id}')">✏️</button>
          <button class="btn-delete" title="Supprimer" onclick="supprimerDoc('${d.id}')">🗑</button>
        </div>
      </div>`).join('')}
    </div>`;
  } catch(e) { container.innerHTML = '<div class="empty-state">Erreur : ' + e.message + '</div>'; }
}

async function ouvrirDoc(id) {
  try {
    const data = await callGAS({ action: 'get', id });
    console.log('Colonne 9 brute:', data[8]);
    console.log('DATA.FILES reçu du GAS:', JSON.stringify(data.files));
    currentDocId     = data.id;
    selectedType     = data.type;
    currentChantier  = data.chantier  || '';
    currentOperateur = data.operateur || '';
    currentDocDate   = (data.date     || '').slice(0, 10);
    conversationHistory = data.history || [];
    currentFiles = (data.files || []).map(f => ({ name: f.name, type: f.type || 'image/jpeg', url: f.url }));
    // Restaurer les labels depuis les marqueurs [PHOTO:label] dans le contenu sauvegardé
    const marqueurs = [...(data.contenu || '').matchAll(/\[PHOTO:([^\]]+)\]/gi)];
    if (marqueurs.length > 0 && currentFiles.length > 0) {
      // Associer chaque marqueur à la photo correspondante par ordre
      marqueurs.forEach((m, i) => {
        const label = m[1].trim();
        // Chercher une photo sans label ou dont le nom contient le label
        const photo = currentFiles.find(f => !f.label) || currentFiles[i];
        if (photo) photo.label = label;
      });
    }
    console.log('currentFiles après ouvrirDoc:', JSON.stringify(currentFiles.map(f=>({name:f.name,url:f.url}))));
    renderFilesList();
    // Afficher
    document.getElementById('chantier').value  = currentChantier;
    document.getElementById('operateur').value = currentOperateur;
    document.getElementById('tab-btn-nouveau').classList.add('active');
    document.getElementById('tab-btn-liste').classList.remove('active');
    document.getElementById('tab-nouveau').style.display = 'block';
    document.getElementById('tab-liste').style.display   = 'none';
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('doc-result').style.display  = '';
    document.getElementById('doc-result').classList.add('visible');
    // Restaurer contenu (sans images corrompues) puis réinjecter photos
    let contenu = data.contenu || '';
    // Restaurer le contenu dans doc-frame
    document.getElementById('doc-frame').innerHTML = contenu;
    // Si doc-content absent du contenu restauré, le recréer
    if (!document.getElementById('doc-content')) {
      const dc = document.createElement('div');
      dc.id = 'doc-content';
      dc.style.padding = '4px 0';
      document.getElementById('doc-frame').appendChild(dc);
    }
    // Restaurer attributs pour pied de page PDF
    const dc = document.getElementById('doc-content');
    if (dc) {
      dc.setAttribute('data-chantier', currentChantier);
      dc.setAttribute('data-date', new Date().toLocaleDateString('fr-FR'));
    }
    // À l'ouverture, les marqueurs sont dans le HTML — injecter normalement
    // Mais si aucun marqueur (ancien doc), les photos iront en bas classiquement
    injecterPhotosMarqueurs();
    const msg = document.getElementById('save-msg');
    msg.innerHTML = '<span class="save-badge save-badge-saving">📄 Document chargé</span>';
    setTimeout(() => msg.innerHTML = '<span class="save-badge save-badge-idle">✓ Sauvegardé</span>', 2000);
  } catch(e) { alert('Erreur ouverture : ' + e.message); }
}

async function supprimerDoc(id) {
  if (!confirm('Supprimer ce document ?')) return;
  await callGAS({ action: 'delete', id });
  chargerListe();
}
